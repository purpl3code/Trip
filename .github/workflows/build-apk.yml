name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        # Resolve optional native dependencies for the Linux runner.
        run: npm install --no-audit --no-fund

      - name: Validate Application
        run: |
          npm run lint
          npm test

      - name: Build Web Application
        run: npm run build

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Sync Capacitor Android
        run: |
          npx capacitor sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate or Restore Keystore
        run: |
          KEYSTORE_PATH="android/trip-release.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "✅ Keystore already exists in repo, reusing it."
          else
            echo "🔑 Generating new keystore..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias trip-key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass TripApp2024! \
              -keypass TripApp2024! \
              -dname "CN=Trip App, OU=Mobile, O=Trip, L=Brazil, S=SP, C=BR"

            echo "📦 Committing keystore to repo so future builds reuse it..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$KEYSTORE_PATH"
            git commit -m "ci: add persistent release keystore for consistent APK signing [skip ci]"
            git push
          fi

      - name: Build Signed Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/trip-release.keystore \
            -Pandroid.injected.signing.store.password=TripApp2024! \
            -Pandroid.injected.signing.key.alias=trip-key \
            -Pandroid.injected.signing.key.password=TripApp2024!

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trip-app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish APK on GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: apk-${{ github.run_number }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Trip.apk
          gh release create "$RELEASE_TAG" Trip.apk \
            --target "$GITHUB_SHA" \
            --title "Trip 1.1.0 · Build ${{ github.run_number }}" \
            --notes "APK Android assinado com o novo design, ícone e melhorias de funcionamento. Baixe Trip.apk nos arquivos desta versão."
